<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pop the Balloons, Malak 🎈</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#5cc8ff;--sky2:#b9ecff;--sun:#ffd96a;--ink:#2a1650;--cream:#fff6ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cloud{position:fixed;background:#fff;border-radius:999px;opacity:.85;z-index:0}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:110px;height:34px;top:22%;left:-20px;animation:drift 38s linear infinite}
.c1::before{width:50px;height:50px;top:-24px;left:18px}.c1::after{width:40px;height:40px;top:-16px;left:56px}
.c2{width:90px;height:28px;top:50%;left:-120px;animation:drift 52s linear infinite;animation-delay:-20s}
.c2::before{width:40px;height:40px;top:-20px;left:14px}.c2::after{width:32px;height:32px;top:-12px;left:46px}
@keyframes drift{to{transform:translateX(130vw)}}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#slots{display:flex;gap:8px}
.slot{width:52px;height:64px;border-radius:16px;border:3px dashed rgba(42,22,80,.4);background:rgba(255,246,236,.6);display:flex;align-items:center;justify-content:center;font:700 2.4rem/1 'Fredoka',sans-serif}
.slot.on{border:3px solid var(--ink);background:var(--sun);box-shadow:0 5px 0 #c99a00;animation:thump .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes thump{from{transform:scale(.3) rotate(-12deg)}to{transform:scale(1) rotate(0)}}
.whole{font:700 clamp(3rem,16vw,4.8rem)/1.1 'Fredoka',sans-serif;background:var(--sun);padding:4px 30px;border-radius:22px;box-shadow:0 6px 0 #c99a00;animation:thump .6s cubic-bezier(.2,1.8,.4,1)}
#toast{max-width:88vw;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;font:500 1.1rem/1.4 'Fredoka',sans-serif;background:var(--cream);padding:6px 18px;border-radius:16px;box-shadow:0 4px 0 rgba(42,22,80,.2)}
.balloon{position:fixed;bottom:-110px;width:62px;height:78px;border-radius:50% 50% 47% 47%;z-index:2;animation:rise linear forwards;cursor:pointer;box-shadow:inset -8px -8px 0 rgba(0,0,0,.12),inset 10px 10px 0 rgba(255,255,255,.3)}
.balloon::before{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-bottom-color:inherit;border-top:0;transform:scale(1.2)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:52px;background:rgba(42,22,80,.35)}
.balloon i{position:absolute;inset:-14px -10px -50px -10px}
@keyframes rise{to{transform:translateY(calc(-100vh - 220px)) translateX(var(--dx))}}
.reveal{position:fixed;z-index:7;pointer-events:none;font:700 6rem/1 'Fredoka',sans-serif;color:var(--cream);text-shadow:0 5px 0 var(--ink),0 0 24px rgba(255,217,106,.9);transform:translate(-50%,-50%);animation:rv 1.1s ease-out forwards}
@keyframes rv{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.screen{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:rgba(42,22,80,.84);color:var(--cream);padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.screen[hidden]{display:none}
.screen h1{font:700 clamp(2.4rem,12vw,3.8rem)/1.1 'Fredoka',sans-serif;color:var(--sun);text-shadow:0 4px 0 rgba(0,0,0,.3)}
.screen h1 b{color:var(--cream)}
.screen p{font-size:1.1rem;font-weight:500;line-height:1.6;max-width:20em}
button{font:700 1.3rem 'Fredoka',sans-serif;color:var(--ink);background:var(--sun);border:0;border-radius:999px;padding:14px 38px;box-shadow:0 6px 0 #c99a00;cursor:pointer;transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #c99a00}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.cloud{animation:none}}
@media (min-width:700px){.balloon{width:90px;height:112px}.balloon::after{height:70px}.slot{width:72px;height:86px;font-size:3.2rem}.whole{font-size:5.4rem;padding:6px 40px}#toast{font-size:1.4rem;padding:8px 26px}.screen p{font-size:1.35rem;max-width:26em}button{font-size:1.5rem;padding:16px 46px}.reveal{font-size:8rem}}
@media (max-height:520px){#hud{gap:4px}.slot{width:40px;height:48px;font-size:1.7rem;border-radius:12px}#toast{min-height:0;font-size:.9rem;padding:3px 12px}.whole{font-size:2.4rem;padding:2px 20px}.screen{gap:10px}.screen h1{font-size:2rem}.screen p{font-size:.95rem}button{padding:10px 26px;font-size:1.05rem}.balloon{width:50px;height:64px}.balloon::after{height:40px}.reveal{font-size:4rem}}
.balloon,.cloud{will-change:transform}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<canvas id="fx"></canvas>
<div id="hud"><div id="slots"></div><div id="toast">Pop the balloons and find the letters of your name</div></div>

<section class="screen" id="start">
  <h1>Let’s play, Malak</h1>
  <p>Your name is hiding inside the balloons, one letter at a time. Pop them and collect the letters in order 🎈</p>
  <button id="go" type="button">Start</button>
</section>

<section class="screen" id="end" hidden>
  <h1>Happy Birthday,<br><b>Small Cake</b> 🎂</h1>
  <p>Wishing you a year as sweet as you are. Make a big wish, Malak</p>
  <button id="again" type="button">Play again 🎈</button>
</section>

<script>
(function(){
  var L=['M','A','L','A','K'],found=0,playing=false,timer=null,active=0,letterActive=false,since=0;
  var cols=['#ff6fa8','#ffd96a','#7ad7ff','#b78cff','#ff9a3d','#3ddc97','#ff4d6d'];
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $=function(id){return document.getElementById(id)};
  var cv=$('fx'),cx=cv.getContext('2d'),W,H,P=[],running=false,D=Math.min(window.devicePixelRatio||1,1.5);
  function size(){W=cv.width=innerWidth*D;H=cv.height=innerHeight*D}
  addEventListener('resize',size);size();
  function burst(x,y,n,c){
    if(reduce)n=Math.round(n/3);
    var pal=c?[c,'#fff6ec','#ffd96a']:['#ff6fa8','#ffd96a','#7ad7ff','#fff6ec','#b78cff'];
    for(var i=0;i<n;i++){var a=Math.random()*6.283,s=(3+Math.random()*9)*D;
      P.push({x:x*D,y:y*D,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3*D,w:(5+Math.random()*6)*D,h:(8+Math.random()*7)*D,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:pal[i%pal.length],g:.3*D,life:60+Math.random()*50})}
    if(!running){running=true;requestAnimationFrame(tick)}
  }
  function tick(){
    cx.clearRect(0,0,W,H);
    for(var i=P.length-1;i>=0;i--){var p=P[i];p.vx*=.98;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
      if(p.life<=0){P.splice(i,1);continue}
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/25);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
    if(P.length)requestAnimationFrame(tick);else running=false;
  }
  function buildSlots(){var s=$('slots');s.innerHTML='';L.forEach(function(){var d=document.createElement('div');d.className='slot';s.appendChild(d)})}
  function say(t){$('toast').textContent=t}
  function showReveal(x,y,ch){var r=document.createElement('div');r.className='reveal';r.textContent=ch;r.style.left=x+'px';r.style.top=y+'px';document.body.appendChild(r);setTimeout(function(){r.remove()},1200)}
  function spawn(){
    if(!playing||active>=7)return;
    var isLetter=!letterActive&&(since>=3||Math.random()<.3);
    since=isLetter?0:since+1;if(isLetter)letterActive=true;
    var b=document.createElement('div');b.className='balloon';
    var c=cols[Math.floor(Math.random()*cols.length)];
    b.style.background=c;b.style.color=c;b.style.left=(6+Math.random()*80)+'vw';
    b.style.animationDuration=(5.5+Math.random()*3.5)+'s';
    b.style.setProperty('--dx',((Math.random()-.5)*70)+'px');
    b.appendChild(document.createElement('i'));active++;
    var gone=false;
    function remove(){if(gone)return;gone=true;active--;if(isLetter)letterActive=false;b.remove()}
    b.addEventListener('pointerdown',function(e){
      e.preventDefault();if(gone||!playing)return;
      var r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
      remove();try{navigator.vibrate&&navigator.vibrate(isLetter?[40,30,60]:25)}catch(_){}
      if(!isLetter){burst(x,y,22,c);return}
      var ch=L[found];burst(x,y,50,c);showReveal(x,y,ch);
      var slot=$('slots').children[found];slot.textContent=ch;slot.classList.add('on');found++;
      if(found>=L.length){finish();return}
      say('Found “'+ch+'”. Now look for the next letter');
    });
    b.addEventListener('animationend',remove);document.body.appendChild(b);
  }
  function start(){
    found=0;playing=true;active=0;letterActive=false;since=0;
    document.querySelectorAll('.balloon').forEach(function(b){b.remove()});
    buildSlots();say('Pop the balloons and find the letters of your name');
    $('start').hidden=true;$('end').hidden=true;
    clearInterval(timer);spawn();spawn();spawn();timer=setInterval(spawn,650);
  }
  function finish(){
    playing=false;clearInterval(timer);say('You found your whole name');
    setTimeout(function(){var s=$('slots');s.innerHTML='';var w=document.createElement('div');w.className='whole';w.textContent='MALAK';s.appendChild(w);burst(innerWidth/2,innerHeight*.2,90)},600);
    setTimeout(function(){
      document.querySelectorAll('.balloon').forEach(function(b){b.remove()});active=0;$('end').hidden=false;
      var w=innerWidth,h=innerHeight;burst(w/2,h*.4,160);
      setTimeout(function(){burst(w*.2,h*.5,110)},350);setTimeout(function(){burst(w*.8,h*.5,110)},650);setTimeout(function(){burst(w/2,h*.3,120)},1000);
    },2200);
  }
  $('go').addEventListener('click',start);$('again').addEventListener('click',start);buildSlots();
})();
</script>
</body>
</html>
